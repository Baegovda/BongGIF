name = "bonggif-report"
main = "src/index.js"
compatibility_date = "2026-10-01"

# KV: rate-limit counters + fingerprint -> issue map.
# Create with:  npx wrangler kv namespace create REPORTS   then paste the id below.
[[kv_namespaces]]
binding = "REPORTS"
id = "6824be73bb144e038496588eb32be102"

[vars]
GITHUB_REPO = "Baegovda/BongGIF"
APP_KEY = "bonggif-report-v1"     # must match bonggif/crashreport.py APP_KEY (basic filter, not security)
RATE_PER_HOUR = "20"              # reports per IP per hour
MAX_COMMENTS = "10"               # comments per issue before only counting

# Secret (never commit):  npx wrangler secret put GITHUB_TOKEN
#   fine-grained PAT, repository access: Baegovda/BongGIF only, permission Issues: Read and write
