# Pull-request and main smoke tests.
#
# Runner is ubuntu-latest, not windows-latest. The seven offscreen suites
# already pass on Linux with this requirements.txt (PySide6>=6.5,<6.9 and the
# imageio-ffmpeg build, which includes libaom-av1). windows-latest stays in
# release.yml for the product build; this file does not change that workflow.
# A second Windows job would repeat the PySide6 + OpenCV install on every PR.
#
# ffmpeg hang: WebM and a few probes call subprocess without stdin=DEVNULL and
# without -nostdin. If that process inherits a controlling terminal it stops
# on SIGTTIN; if stdin is an open pipe it blocks on read. This job closes
# stdin (/dev/null) for every test process. Do not pipe the suites in a way
# that leaves stdin attached to a tty.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  QT_QPA_PLATFORM: offscreen
  BONGGIF_REPORT_URL: ""
  CI: "true"

jobs:
  smoke:
    name: smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt offscreen libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libnss3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PySide6 pin, Qt, and ffmpeg encoders
        run: |
          set -euo pipefail
          exec </dev/null
          python - <<'PY'
          import importlib.metadata as md
          v = md.version("PySide6")
          parts = tuple(int(x) for x in v.split(".")[:3])
          parts = parts + (0,) * (3 - len(parts))
          if not ((6, 5, 0) <= parts < (6, 9, 0)):
              raise SystemExit(f"PySide6 {v} is outside requirements pin >=6.5,<6.9")
          print(f"PySide6 {v} within >=6.5,<6.9")
          for dist in ("numpy", "Pillow", "opencv-contrib-python-headless", "imageio-ffmpeg"):
              print(f"{dist} {md.version(dist)}")
          PY
          python -c 'from PySide6.QtWidgets import QApplication; import sys; QApplication(sys.argv); print("qt offscreen ok")'
          check_ffmpeg() {
            python - <<'PY'
          import subprocess, sys
          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          print("ffmpeg:", ff)
          ver = subprocess.run(
              [ff, "-version"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, stdin=subprocess.DEVNULL,
          )
          print(ver.stdout.decode("utf-8", "replace").splitlines()[0])
          enc = subprocess.run(
              [ff, "-hide_banner", "-encoders"],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, stdin=subprocess.DEVNULL,
          )
          text = enc.stdout.decode("utf-8", "replace")
          need = ["libaom-av1", "libx264", "libvpx", "libvpx-vp9"]
          missing = [n for n in need if n not in text]
          print("missing encoders:", ", ".join(missing) if missing else "(none)")
          # export suite is 42 only when libaom-av1 is present; the skip path records a failed check
          sys.exit(2 if missing else 0)
          PY
          }
          set +e
          check_ffmpeg
          st=$?
          set -e
          if [[ $st -eq 2 ]]; then
            echo "bundled ffmpeg is missing an encoder; installing distro ffmpeg"
            sudo apt-get install -y --no-install-recommends ffmpeg
            ff=$(command -v ffmpeg)
            echo "IMAGEIO_FFMPEG_EXE=$ff" >> "$GITHUB_ENV"
            export IMAGEIO_FFMPEG_EXE="$ff"
            check_ffmpeg
          elif [[ $st -ne 0 ]]; then
            exit "$st"
          fi

      - name: Smoke tests (offscreen)
        run: |
          set -uo pipefail
          # Close stdin for this step. Child ffmpeg must not inherit a tty or an open pipe.
          exec </dev/null
          fail=0
          {
            echo "## Smoke tests"
            echo ""
            echo "| suite | result | line | seconds |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          run_suite() {
            local file="$1" expect="$2"
            local log="ci-${file%.py}.log"
            local start st line elapsed
            echo "::group::${file}"
            start=$(date +%s)
            set +e
            timeout --kill-after=30s 15m python -u "$file" 2>&1 | tee "$log"
            st=${PIPESTATUS[0]}
            set -e
            elapsed=$(( $(date +%s) - start ))
            # export prints a NUL inside a PASS extra (APNG tEXt). Without -a, grep
            # treats the log as binary and hides the 결과 line.
            line=$(grep -aE '^결과: ' "$log" | tail -1 | tr -d '\r' || true)
            if [[ $st -eq 0 && "$line" == "결과: ${expect}/${expect} 통과" ]]; then
              echo "| \`${file}\` | PASS | ${line} | ${elapsed} |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${file} expected 결과: ${expect}/${expect} 통과 (exit ${st}, ${elapsed}s): ${line:-no result line}"
              echo "| \`${file}\` | FAIL | ${line:-exit ${st}} | ${elapsed} |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
            echo "::endgroup::"
          }
          run_suite smoke_test.py 88
          run_suite smoke_test_converter.py 62
          run_suite smoke_test_updater.py 40
          run_suite smoke_test_crash.py 15
          run_suite smoke_test_export.py 42
          run_suite smoke_test_masks.py 10
          run_suite smoke_test_webpclip.py 33
          if [[ $fail -ne 0 ]]; then
            echo "::error::one or more smoke suites failed"
            exit 1
          fi
          echo "All 7 smoke suites passed (88/62/40/15/42/10/33)"
