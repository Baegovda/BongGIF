name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $v = python -c "import re;print(re.search(r'__version__\s*=\s*.([0-9A-Za-z.\-]+).', open('bonggif/version.py',encoding='utf-8').read()).group(1))"
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($v -ne $tag) { Write-Error "bonggif/version.py ($v) != tag ($tag)"; exit 1 }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
        run: |
          $fail = 0
          foreach ($t in "smoke_test.py","smoke_test_converter.py","smoke_test_updater.py","smoke_test_export.py","smoke_test_masks.py","smoke_test_webpclip.py") {
            python $t
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::$t failed (exit $LASTEXITCODE)"; $fail = 1 }
          }
          exit $fail

      - name: Build (PyInstaller onedir)
        shell: pwsh
        run: |
          python scripts/build_frozen.py

      - name: Verify frozen OpenCV
        shell: pwsh
        run: |
          # --windowed exe: `&` does not wait, so $LASTEXITCODE stays empty.
          $out = Join-Path $PWD selftest.out.txt
          $err = Join-Path $PWD selftest.err.txt
          $p = Start-Process -FilePath "$PWD\dist\BongGIF\BongGIF.exe" -ArgumentList '--selftest' -Wait -PassThru -WorkingDirectory "$PWD" -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out, $err
          $text = "$(Get-Content -Raw $out)$(Get-Content -Raw $err)"
          if ($p.ExitCode -ne 0) { Write-Error "frozen cv2 selftest failed (exit $($p.ExitCode))"; exit 1 }
          if ($text -notmatch 'selftest ok') { Write-Error "frozen cv2 selftest output missing 'selftest ok'"; exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          $zip = "BongGIF-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist/BongGIF -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          generate_release_notes: true
